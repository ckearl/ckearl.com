AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Morning Brief for ckearl.com/morning-brief

Parameters:
  BriefPasswordHash:
    Type: String
    NoEcho: true
    Description: SHA-256 hex of the page password (from .env via scripts/deploy.sh)
  BriefTokenSecret:
    Type: String
    NoEcho: true
    Description: Signs login tokens (from .env via scripts/deploy.sh)
  SpotifyBucket:
    Type: String
    Description: spotify_stats bucket holding the listening snapshot (from .env via scripts/deploy.sh)
  SpotifyClientId:
    Type: String
    Default: ""
    Description: spotify_stats app client, for discographies and new releases (from .env via scripts/deploy.sh)
  SpotifyClientSecret:
    Type: String
    Default: ""
    NoEcho: true
  SpotifyRefreshToken:
    Type: String
    Default: ""
    NoEcho: true
  YouTubeApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: YouTube Data API key for score highlights (from .env via scripts/deploy.sh)
  GoogleClientId:
    Type: String
    Description: Google OAuth client (from .env via scripts/deploy.sh)
  GoogleClientSecret:
    Type: String
    NoEcho: true
  GoogleRefreshToken:
    Type: String
    NoEcho: true
  TodosKeyHash:
    Type: String
    NoEcho: true
    Description: SHA-256 hex of the iPhone Shortcut's key (from .env via scripts/deploy.sh)
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: Claude API key (from .env via scripts/deploy.sh)
  GarminApiKey:
    Type: String
    NoEcho: true
    Description: Garmin Connect Personal API key (from .env via scripts/deploy.sh)
  TrainingEasyPace:
    Type: String
    Default: ""
    Description: Easy pace per mile, such as 8:30-8:45 (from .env via scripts/deploy.sh)
  TrainingBaseMiles:
    Type: String
    Default: "7.5"
    Description: Weekly miles to plan from when Garmin has no runs (from .env via scripts/deploy.sh)
  CalendarOwners:
    Type: String
    Default: ""
    Description: Comma-separated calendarId=hers|shared|skip (from .env via scripts/deploy.sh)
  WorkHours:
    Type: String
    Default: "Mon-Fri,08:00-17:00"
    Description: Usual work hours, such as Mon-Fri,08:00-17:00 (from .env via scripts/deploy.sh)
  MorningHelp:
    Type: String
    Default: "Mon-Fri,07:00-07:40"
    Description: The morning stretch spent helping get out the door, such as Mon-Fri,07:00-07:40 (from .env via scripts/deploy.sh)
  AllowedOrigins:
    Type: String
    Default: https://ckearl.com,http://localhost:53000,http://100.73.47.33:53000

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: src/
    MemorySize: 256
    Environment:
      Variables:
        BRIEF_TABLE: !Ref BriefTable

Resources:
  BriefTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: MorningBrief
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: date, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: date, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  GenerateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: morning-brief-generate
      Handler: handlers.generate
      Timeout: 180
      MemorySize: 512
      Environment:
        Variables:
          BRIEF_TABLE: !Ref BriefTable
          SPOTIFY_BUCKET: !Ref SpotifyBucket
          SPOTIFY_CLIENT_ID: !Ref SpotifyClientId
          SPOTIFY_CLIENT_SECRET: !Ref SpotifyClientSecret
          SPOTIFY_REFRESH_TOKEN: !Ref SpotifyRefreshToken
          YOUTUBE_API_KEY: !Ref YouTubeApiKey
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          GOOGLE_REFRESH_TOKEN: !Ref GoogleRefreshToken
          CALENDAR_OWNERS: !Ref CalendarOwners
          GARMIN_API_KEY: !Ref GarminApiKey
          TRAINING_EASY_PACE: !Ref TrainingEasyPace
          TRAINING_BASE_MILES: !Ref TrainingBaseMiles
          WORK_HOURS: !Ref WorkHours
          MORNING_HELP: !Ref MorningHelp
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
      Policies:
        - DynamoDBWritePolicy: { TableName: !Ref BriefTable }
        - DynamoDBReadPolicy: { TableName: !Ref BriefTable }
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${SpotifyBucket}/data/snapshot.json
      Events:
        Morning:
          Type: Schedule
          Properties:
            # EventBridge rules run in UTC: 5:30 AM Mountain in summer, 4:30 AM in winter.
            Schedule: cron(30 11 * * ? *)

  TodayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: morning-brief-today
      Handler: handlers.today
      Timeout: 10
      Environment:
        Variables:
          BRIEF_TABLE: !Ref BriefTable
          BRIEF_TOKEN_SECRET: !Ref BriefTokenSecret
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref BriefTable }
      Events:
        Today:
          Type: Api
          Properties:
            RestApiId: !Ref BriefApi
            Path: /brief/today
            Method: GET

  SessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: morning-brief-session
      Handler: handlers.session
      Timeout: 10
      Environment:
        Variables:
          BRIEF_PASSWORD_HASH: !Ref BriefPasswordHash
          BRIEF_TOKEN_SECRET: !Ref BriefTokenSecret
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Events:
        Session:
          Type: Api
          Properties:
            RestApiId: !Ref BriefApi
            Path: /brief/session
            Method: POST

  TodosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: morning-brief-todos
      Handler: handlers.receive_todos
      Timeout: 10
      Environment:
        Variables:
          BRIEF_TABLE: !Ref BriefTable
          TODOS_KEY_HASH: !Ref TodosKeyHash
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref BriefTable }
      Events:
        Todos:
          Type: Api
          Properties:
            RestApiId: !Ref BriefApi
            Path: /brief/todos
            Method: POST

  WorkFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: morning-brief-work
      Handler: handlers.receive_work
      Timeout: 10
      Environment:
        Variables:
          BRIEF_TABLE: !Ref BriefTable
          TODOS_KEY_HASH: !Ref TodosKeyHash
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Policies:
        - DynamoDBWritePolicy: { TableName: !Ref BriefTable }
      Events:
        Work:
          Type: Api
          Properties:
            RestApiId: !Ref BriefApi
            Path: /brief/work
            Method: POST

  GoalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: morning-brief-goal
      Handler: handlers.save_goal
      # API Gateway stops waiting at 29 seconds.
      Timeout: 28
      Environment:
        Variables:
          BRIEF_TABLE: !Ref BriefTable
          BRIEF_TOKEN_SECRET: !Ref BriefTokenSecret
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          GOOGLE_REFRESH_TOKEN: !Ref GoogleRefreshToken
          CALENDAR_OWNERS: !Ref CalendarOwners
          GARMIN_API_KEY: !Ref GarminApiKey
          TRAINING_EASY_PACE: !Ref TrainingEasyPace
          TRAINING_BASE_MILES: !Ref TrainingBaseMiles
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref BriefTable }
      Events:
        Goal:
          Type: Api
          Properties:
            RestApiId: !Ref BriefApi
            Path: /brief/goal
            Method: POST

  DoneFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: morning-brief-done
      Handler: handlers.mark_done
      # API Gateway stops waiting at 29 seconds.
      Timeout: 28
      Environment:
        Variables:
          BRIEF_TABLE: !Ref BriefTable
          BRIEF_TOKEN_SECRET: !Ref BriefTokenSecret
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          GOOGLE_REFRESH_TOKEN: !Ref GoogleRefreshToken
          CALENDAR_OWNERS: !Ref CalendarOwners
          GARMIN_API_KEY: !Ref GarminApiKey
          TRAINING_EASY_PACE: !Ref TrainingEasyPace
          TRAINING_BASE_MILES: !Ref TrainingBaseMiles
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref BriefTable }
      Events:
        Done:
          Type: Api
          Properties:
            RestApiId: !Ref BriefApi
            Path: /brief/done
            Method: POST

  SuggestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: morning-brief-suggestion
      Handler: handlers.mark_suggestion
      # API Gateway stops waiting at 29 seconds.
      Timeout: 28
      Environment:
        Variables:
          BRIEF_TABLE: !Ref BriefTable
          BRIEF_TOKEN_SECRET: !Ref BriefTokenSecret
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          GOOGLE_REFRESH_TOKEN: !Ref GoogleRefreshToken
          CALENDAR_OWNERS: !Ref CalendarOwners
          GARMIN_API_KEY: !Ref GarminApiKey
          TRAINING_EASY_PACE: !Ref TrainingEasyPace
          TRAINING_BASE_MILES: !Ref TrainingBaseMiles
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref BriefTable }
      Events:
        Suggestion:
          Type: Api
          Properties:
            RestApiId: !Ref BriefApi
            Path: /brief/suggestion
            Method: POST

  ReplanRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: morning-brief-replan-request
      Handler: handlers.request_replan
      Timeout: 15
      Environment:
        Variables:
          BRIEF_TABLE: !Ref BriefTable
          BRIEF_TOKEN_SECRET: !Ref BriefTokenSecret
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          REPLAN_FUNCTION: !Ref ReplanFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref BriefTable }
        - LambdaInvokePolicy: { FunctionName: !Ref ReplanFunction }
      Events:
        Replan:
          Type: Api
          Properties:
            RestApiId: !Ref BriefApi
            Path: /brief/replan
            Method: POST

  # Runs the replan in the background; only ReplanRequestFunction calls it.
  ReplanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: morning-brief-replan
      Handler: handlers.replan
      Timeout: 180
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      MemorySize: 512
      Environment:
        Variables:
          BRIEF_TABLE: !Ref BriefTable
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          GOOGLE_REFRESH_TOKEN: !Ref GoogleRefreshToken
          CALENDAR_OWNERS: !Ref CalendarOwners
          WORK_HOURS: !Ref WorkHours
          MORNING_HELP: !Ref MorningHelp
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref BriefTable }

  MealsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: morning-brief-meals
      Handler: handlers.save_meals
      Timeout: 10
      Environment:
        Variables:
          BRIEF_TABLE: !Ref BriefTable
          BRIEF_TOKEN_SECRET: !Ref BriefTokenSecret
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref BriefTable }
      Events:
        Meals:
          Type: Api
          Properties:
            RestApiId: !Ref BriefApi
            Path: /brief/meals
            Method: POST

  EventFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: morning-brief-event
      Handler: handlers.add_event
      Timeout: 15
      Environment:
        Variables:
          BRIEF_TABLE: !Ref BriefTable
          BRIEF_TOKEN_SECRET: !Ref BriefTokenSecret
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          GOOGLE_REFRESH_TOKEN: !Ref GoogleRefreshToken
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref BriefTable }
      Events:
        Event:
          Type: Api
          Properties:
            RestApiId: !Ref BriefApi
            Path: /brief/event
            Method: POST

  BriefApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: MorningBriefAPI
      StageName: prod
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Authorization,Content-Type'"
        # The Lambda checks the real origin on each response.
        AllowOrigin: "'*'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5

Outputs:
  ApiUrl:
    Value: !Sub https://${BriefApi}.execute-api.${AWS::Region}.amazonaws.com/prod
