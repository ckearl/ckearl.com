AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Morning Brief for ckearl.com/morning-brief

Parameters:
  BriefPasswordHash:
    Type: String
    NoEcho: true
    Description: SHA-256 hex of the page password (from .env via scripts/deploy.sh)
  BriefTokenSecret:
    Type: String
    NoEcho: true
    Description: Signs login tokens (from .env via scripts/deploy.sh)
  SpotifyBucket:
    Type: String
    Description: spotify_stats bucket holding the listening snapshot (from .env via scripts/deploy.sh)
  GoogleClientId:
    Type: String
    Description: Google OAuth client (from .env via scripts/deploy.sh)
  GoogleClientSecret:
    Type: String
    NoEcho: true
  GoogleRefreshToken:
    Type: String
    NoEcho: true
  TodosKeyHash:
    Type: String
    NoEcho: true
    Description: SHA-256 hex of the iPhone Shortcut's key (from .env via scripts/deploy.sh)
  AllowedOrigins:
    Type: String
    Default: https://ckearl.com,http://localhost:53000,http://100.73.47.33:53000

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: src/
    MemorySize: 256
    Environment:
      Variables:
        BRIEF_TABLE: !Ref BriefTable

Resources:
  BriefTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: MorningBrief
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: date, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: date, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  GenerateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: morning-brief-generate
      Handler: handlers.generate
      Timeout: 180
      MemorySize: 512
      Environment:
        Variables:
          BRIEF_TABLE: !Ref BriefTable
          SPOTIFY_BUCKET: !Ref SpotifyBucket
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          GOOGLE_REFRESH_TOKEN: !Ref GoogleRefreshToken
      Policies:
        - DynamoDBWritePolicy: { TableName: !Ref BriefTable }
        - DynamoDBReadPolicy: { TableName: !Ref BriefTable }
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${SpotifyBucket}/data/snapshot.json
      Events:
        Morning:
          Type: Schedule
          Properties:
            # EventBridge rules run in UTC: 5:30 AM Mountain in summer, 4:30 AM in winter.
            Schedule: cron(30 11 * * ? *)

  TodayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: morning-brief-today
      Handler: handlers.today
      Timeout: 10
      Environment:
        Variables:
          BRIEF_TABLE: !Ref BriefTable
          BRIEF_TOKEN_SECRET: !Ref BriefTokenSecret
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref BriefTable }
      Events:
        Today:
          Type: Api
          Properties:
            RestApiId: !Ref BriefApi
            Path: /brief/today
            Method: GET

  SessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: morning-brief-session
      Handler: handlers.session
      Timeout: 10
      Environment:
        Variables:
          BRIEF_PASSWORD_HASH: !Ref BriefPasswordHash
          BRIEF_TOKEN_SECRET: !Ref BriefTokenSecret
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Events:
        Session:
          Type: Api
          Properties:
            RestApiId: !Ref BriefApi
            Path: /brief/session
            Method: POST

  TodosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: morning-brief-todos
      Handler: handlers.receive_todos
      Timeout: 10
      Environment:
        Variables:
          BRIEF_TABLE: !Ref BriefTable
          TODOS_KEY_HASH: !Ref TodosKeyHash
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Policies:
        - DynamoDBWritePolicy: { TableName: !Ref BriefTable }
      Events:
        Todos:
          Type: Api
          Properties:
            RestApiId: !Ref BriefApi
            Path: /brief/todos
            Method: POST

  BriefApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: MorningBriefAPI
      StageName: prod
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Authorization,Content-Type'"
        # The Lambda checks the real origin on each response.
        AllowOrigin: "'*'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5

Outputs:
  ApiUrl:
    Value: !Sub https://${BriefApi}.execute-api.${AWS::Region}.amazonaws.com/prod
